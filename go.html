<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading…</title>
<style>
  html,body{margin:0;height:100%;background:#1c1f26;color:#8b91a0;font:14px Cantarell,"Noto Sans",sans-serif;display:grid;place-items:center}
  .sp{width:28px;height:28px;border:3px solid #363b47;border-top-color:#7aa2f7;border-radius:50%;animation:r .8s linear infinite;margin:0 auto 12px}
  @keyframes r{to{transform:rotate(360deg)}}
  #sj-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  pre{white-space:pre-wrap;max-width:520px;color:#e3e5ea}
</style>
<script src="/scram/scramjet.all.js"></script>
<script src="/baremux/index.js"></script>
<script src="register-sw.js"></script>
</head>
<body>
<div id="box"><div class="sp"></div><div id="msg">Loading…</div></div>
<script>
// Opens ?url=<address> through Scramjet. The Apps window on the games site uses this page.
(async function(){
  var msg = document.getElementById("msg");
  try {
    var target = new URLSearchParams(location.search).get("url") || "https://www.google.com";
    var sj = new ($scramjetLoadController().ScramjetController)({
      files: { wasm: "/scram/scramjet.wasm.wasm", all: "/scram/scramjet.all.js", sync: "/scram/scramjet.sync.js" }
    });
    await sj.init();
    await registerSW();
    await navigator.serviceWorker.ready;
    var conn = new BareMux.BareMuxConnection("/baremux/worker.js");
    var wisp = (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/wisp/";
    if ((await conn.getTransport()) !== "/libcurl/index.mjs") await conn.setTransport("/libcurl/index.mjs", [{ websocket: wisp }]);
    var frame = sj.createFrame();
    frame.frame.id = "sj-frame";
    document.body.innerHTML = "";
    document.body.append(frame.frame);
    frame.go(target);
  } catch (e) {
    document.querySelector(".sp").remove();
    msg.innerHTML = "Couldn't start the proxy.<pre></pre>";
    msg.querySelector("pre").textContent = String(e && e.stack || e);
  }
})();
</script>
</body>
</html>
